trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.7.5'

stages:

# ============================================================
# STAGE 1 — Terraform Validation & Security
# ============================================================
- stage: Validate
  displayName: 'Terraform Validate & Security'
  jobs:

  - job: TerraformChecks
    displayName: 'Terraform Checks'
    steps:

    - checkout: self

    # Install Terraform
    # Install Terraform
    - script: |
       wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
       unzip -o terraform_$(terraformVersion)_linux_amd64.zip
       sudo mv terraform /usr/local/bin/
       terraform version
      displayName: 'Install Terraform'


    # Terraform Format Check
    - script: |
        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'

    # Terraform Init
    - script: |
        cd infra/terraform/environments/dev
        terraform init -backend=false
      displayName: 'Terraform Init'

    # Terraform Validate
    - script: |
        cd infra/terraform/environments/dev
        terraform validate
      displayName: 'Terraform Validate'

    # Checkov Security Scan
    - script: |
        pip install checkov
        checkov -d infra/terraform --framework terraform
      displayName: 'Checkov IaC Security Scan'

