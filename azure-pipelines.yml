trigger:
  branches:
    include:
      - main
      - feature/azure-devops-pipeline

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.7.5'
  azureServiceConnection: 'sc-azure-platform-dev'

stages:

# ============================================================
# STAGE 1 — Terraform Validation & Security
# ============================================================
- stage: Validate
  displayName: 'Terraform Validate & Security'

  jobs:
  - job: TerraformChecks
    displayName: 'Terraform Checks'

    steps:

    - checkout: self

    # Install Terraform
    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip -o terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform'

    # Terraform Format Check
    - script: |
        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'

    # Terraform Init
    - script: |
        cd infra/terraform/environments/dev
        terraform init -backend=false
      displayName: 'Terraform Init'

    # Terraform Validate
    - script: |
        cd infra/terraform/environments/dev
        terraform validate
      displayName: 'Terraform Validate'

    # Checkov Security Scan
    - script: |
        pip install checkov
        checkov -d infra/terraform --framework terraform
      displayName: 'Checkov IaC Security Scan'

    # Gitleaks Secret Scan
    - script: |
        docker run --rm \
          -v "$(Build.SourcesDirectory):/repo" \
          ghcr.io/gitleaks/gitleaks:latest \
          git /repo --redact
      displayName: 'Gitleaks Secret Scan'


# ============================================================
# STAGE 2 — Terraform Plan
# ============================================================
- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self

    # Install Terraform
    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip -o terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform'

    # Azure authentication through Workload Identity Federation
    - task: AzureCLI@2
      displayName: 'Azure Login - Workload Identity Federation'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true

        inlineScript: |
          echo "Azure authentication successful"

          az account show

          # Configure Terraform for Workload Identity Federation
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          export ARM_OIDC_TOKEN="$idToken"

          cd infra/terraform/environments/dev

          terraform init -reconfigure

          terraform plan -out=tfplan

      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
        AZURESUBSCRIPTION_SERVICE_CONNECTION_ID: $(azureServiceConnection)

